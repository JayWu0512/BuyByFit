name: Sync Vercel deploy repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-frontend:
    name: Mirror frontend to deploy repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split and publish frontend
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          DEPLOY_REPO: JayWu0512/buy-by-fit
        run: |
          test -n "$DEPLOY_REPO_TOKEN" || {
            echo "Missing DEPLOY_REPO_TOKEN. Add a fine-grained token with Contents: Read and write access to $DEPLOY_REPO."
            exit 1
          }

          split_commit=$(git subtree split --prefix=frontend)
          git push --force "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/${DEPLOY_REPO}.git" "${split_commit}:main"

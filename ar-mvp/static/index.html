<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BuyByFit AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #f6f4f0; --surface: #ffffff; --text: #1d1b18; --muted: #6d675f; --line: #e4dfd7;
    --accent: #b5562b; --accent-ink: #ffffff; --chip: #efe9e1; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151412; --surface: #1f1d1a; --text: #f1ede7; --muted: #a59e94; --line: #34312c;
            --accent: #e07a4a; --accent-ink: #1a0f09; --chip: #2a2723; --danger: #f2b8b5; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.35rem; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }

  .ask { display: flex; gap: 10px; align-items: center; }
  .mic { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
    box-shadow: 0 4px 14px rgb(0 0 0 / .18); transition: transform .15s; }
  .mic:active { transform: scale(.95); }
  .mic.listening { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
                     50% { box-shadow: 0 0 0 14px transparent; } }
  .mic svg { width: 28px; height: 28px; }
  form { flex: 1; display: flex; gap: 8px; min-width: 0; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: inherit; }
  .go { padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text); font: inherit; cursor: pointer; }
  .hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; min-height: 1.3em; }
  .hint.err { color: var(--danger); }

  .parsed { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 4px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 4px 10px; font-size: .82rem; }
  .note { color: var(--muted); font-size: .85rem; margin: 6px 0 0; }

  .results { display: grid; gap: 10px; margin-top: 14px; }
  .card { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
    color: inherit; font: inherit; cursor: pointer; width: 100%; }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card img { width: 84px; height: 84px; object-fit: contain; background: #fff; border-radius: 10px; }
  .card .t { font-weight: 600; font-size: .93rem; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .card .m { color: var(--muted); font-size: .82rem; margin-top: 3px; }

  .viewer { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; }
  .viewer[hidden] { display: none; }
  model-viewer { width: 100%; height: 360px; background: linear-gradient(var(--chip), var(--surface));
    --poster-color: transparent; }
  .ar-btn { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); border: 0;
    border-radius: 999px; padding: 12px 22px; background: var(--accent); color: var(--accent-ink);
    font: 600 1rem system-ui, sans-serif; box-shadow: 0 4px 14px rgb(0 0 0 / .25); cursor: pointer; }
  .vinfo { padding: 12px 14px; font-size: .88rem; color: var(--muted); }
  .vinfo b { color: var(--text); }
  .progress { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent);
    transform-origin: left; transform: scaleX(0); transition: transform .2s; }
  footer { color: var(--muted); font-size: .75rem; margin-top: 28px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>See it in your room</h1>
  <p class="sub">Say the vibe and the space you have. For example: “a cozy mid-century sofa that fits 230 by 100.”
    Or <a href="/live" style="color:var(--accent);font-weight:600">go live: talk while the camera is on →</a></p>

  <div class="ask">
    <button class="mic" id="mic" aria-label="Speak">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <form id="form">
      <input type="text" id="q" placeholder="…or type it" autocomplete="off" enterkeyhint="search">
      <button class="go" type="submit">Go</button>
    </form>
  </div>
  <p class="hint" id="hint"></p>

  <div class="parsed" id="parsed"></div>
  <p class="note" id="note"></p>
  <div class="results" id="results"></div>

  <section class="viewer" id="viewer" hidden>
    <model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
      camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1" interaction-prompt="none">
      <button slot="ar-button" class="ar-btn">View in your room</button>
      <div slot="progress-bar" class="progress" id="progress"></div>
    </model-viewer>
    <div class="vinfo" id="vinfo"></div>
  </section>

  <footer>Products and 3D models: <a href="https://amazon-berkeley-objects.s3.amazonaws.com/index.html">Amazon Berkeley Objects</a>, © Amazon.com, CC BY 4.0. Shown at real size.</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const hint = (msg, err = false) => { $("hint").textContent = msg; $("hint").classList.toggle("err", err); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cm = (v) => Math.round(v);
let current = [];

// ---------- voice
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    $("q").value = r[0].transcript;
    if (r.isFinal) run(r[0].transcript);
  };
  rec.onerror = (e) => hint(e.error === "not-allowed" ? "Microphone blocked. Allow it in the browser, or type instead." : "Didn’t catch that. Try again.", true);
  rec.onend = () => { listening = false; $("mic").classList.remove("listening"); };
} else {
  hint("Voice isn’t supported in this browser. Type instead.");
}
$("mic").onclick = () => {
  if (!rec) { $("q").focus(); return; }
  if (listening) { rec.stop(); return; }
  try { rec.start(); listening = true; $("mic").classList.add("listening"); hint("Listening…"); } catch {}
};
$("form").onsubmit = (e) => { e.preventDefault(); if ($("q").value.trim()) run($("q").value.trim()); };

// ---------- search
async function run(text) {
  hint("Finding pieces that fit…");
  $("results").innerHTML = ""; $("parsed").innerHTML = ""; $("note").textContent = "";
  try {
    const res = await fetch("/api/search", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ query: text }) });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    showParsed(data.parsed);
    $("note").textContent = data.note || "";
    current = data.results;
    if (!current.length) { hint("Nothing AR-ready fits that. Try a bigger space or another piece.", true); return; }
    hint("Tap one to preview it, then “View in your room”.");
    $("results").innerHTML = current.map((p, i) => `
      <button class="card" data-i="${i}">
        <img src="${esc(p.image_url)}" alt="" loading="lazy">
        <div><div class="t">${esc(p.title)}</div>
          <div class="m">${esc(p.product_type.replace(/_/g, " ").toLowerCase())} · ${cm(p.width_cm)}×${cm(p.depth_cm)}×${cm(p.height_cm)} cm · match ${(p.similarity * 100).toFixed(0)}%</div></div>
      </button>`).join("");
    document.querySelectorAll(".card").forEach((b) => b.onclick = () => select(+b.dataset.i));
    select(0);
  } catch (err) {
    hint("Search failed. Is the server running?", true);
  }
}

function showParsed(p) {
  const chips = [`“${p.vibe}”`];
  if (p.types) chips.push(p.types[0].replace(/_/g, " ").toLowerCase());
  const fit = [p.max_w && `W ≤ ${cm(p.max_w)}`, p.max_d && `D ≤ ${cm(p.max_d)}`, p.max_h && `H ≤ ${cm(p.max_h)}`].filter(Boolean);
  if (fit.length) chips.push("fits " + fit.join(" · ") + " cm");
  $("parsed").innerHTML = chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("");
}

// ---------- 3D / AR
const mv = $("mv");
function select(i) {
  const p = current[i];
  document.querySelectorAll(".card").forEach((b) => b.classList.toggle("active", +b.dataset.i === i));
  $("viewer").hidden = false;
  mv.scale = "1 1 1";
  mv.alt = p.title;
  mv.poster = p.image_url;
  mv.src = p.ar_model_url;
  $("vinfo").innerHTML = `<b>${esc(p.title)}</b><br>${cm(p.width_cm)} W × ${cm(p.depth_cm)} D × ${cm(p.height_cm)} H cm`;
  mv.dataset.listing = JSON.stringify([p.width_cm, p.depth_cm, p.height_cm]);
  $("viewer").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

mv.addEventListener("progress", (e) => {
  $("progress").style.transform = `scaleX(${e.detail.totalProgress})`;
  $("progress").style.opacity = e.detail.totalProgress >= 1 ? 0 : 1;
});

// Real size: ABO models are in metres. If one is badly off from its listing, rescale it to match.
mv.addEventListener("load", () => {
  const d = mv.getDimensions();                       // metres
  const listing = JSON.parse(mv.dataset.listing || "[]").filter(Boolean);
  const modelMax = Math.max(d.x, d.y, d.z);
  if (!listing.length || !modelMax) return;
  const ratio = Math.max(...listing) / 100 / modelMax;
  if (ratio < 0.75 || ratio > 1.33) mv.scale = `${ratio} ${ratio} ${ratio}`;
  if (!mv.canActivateAR) {
    $("vinfo").insertAdjacentHTML("beforeend", "<br>AR needs a phone with ARCore (Android Chrome) or ARKit (iPhone Safari). Showing a 3D preview.");
  }
});
// Demo links: /?q=a cozy mid-century sofa that fits 230 by 100
const preset = new URLSearchParams(location.search).get("q");
if (preset) { $("q").value = preset; run(preset); }

mv.addEventListener("ar-status", (e) => {
  if (e.detail.status === "failed") hint("AR couldn’t start on this device.", true);
});
</script>
</body>
</html>
